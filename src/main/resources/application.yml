spring:
  application:
    name: smart-budget-ai

  datasource:
    url: jdbc:h2:mem:smartbudgetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      api-key: ${AI_API_KEY:${OPENAI_API_KEY:demo-key}}
      chat:
        options:
          model: ${AI_CHAT_MODEL:llama-3.3-70b-versatile}
          temperature: 0.2
      audio:
        transcription:
          options:
            model: ${AI_STT_MODEL:whisper-large-v3-turbo}
            language: pt
        speech:
          options:
            model: ${AI_TTS_MODEL:tts-1}
            voice: alloy

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: ${PORT:8080}

app:
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:groq}
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      completions-path: /chat/completions
      api-key: ${GEMINI_API_KEY:demo-key}
      model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  session:
    retention-hours: ${SESSION_RETENTION_HOURS:24}
    cleanup-interval-ms: ${SESSION_CLEANUP_INTERVAL_MS:3600000}
